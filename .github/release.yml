# Configures the body of releases automatically generated by GitHub
# (generate_release_notes in .github/workflows/build-desktop-release.yml).
# PRs are grouped by the labels applied by .github/pr-labeler.yml.
changelog:
  exclude:
    labels:
      - dependencies
  categories:
    - title: Features
      labels:
        - type/feature
    - title: Enhancements
      labels:
        - type/enhancement
    - title: Bug Fixes
      labels:
        - type/bug-fix
    - title: Dev / Chores
      labels:
        - type/dev
    - title: Other Changes
      labels:
        - '*'
