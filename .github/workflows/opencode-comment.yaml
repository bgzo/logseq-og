name: opencode-comment

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode-comment:
    if: |
      github.event.comment != null &&
      github.event.comment.user.login == 'bgzo' &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    # 只读 contents：即使工作区变脏或 agent 被注入，opencode 也无法 push
    permissions:
      contents: read
      # 评论需要写权限
      pull-requests: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 用 workflow 的 GITHUB_TOKEN（contents: read），不再用 OpenCode App token：
      # App token 有写权限，能绕开下面的 bash deny 规则直接 commit/push
      USE_GITHUB_TOKEN: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      # 配置写到全局目录（~/.config/opencode/opencode.json），不要写进仓库目录：
      # opencode 结束时会对「变脏的工作区」执行 git add/commit/push，写进仓库会把自己提交上去
      - name: Configure opencode CI permissions (deny rm / git commit / git push)
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "bash": {
                "*": "allow",
                "rm *": "deny",
                "rmdir *": "deny",
                "shred *": "deny",
                "truncate *": "deny",
                "git commit": "deny",
                "git commit *": "deny",
                "git * commit*": "deny",
                "*git commit*": "deny",
                "git push": "deny",
                "git push *": "deny",
                "git * push*": "deny",
                "*git push*": "deny"
              },
              "read": "allow",
              "edit": "deny",
              "glob": "allow",
              "grep": "allow",
              "list": "allow",
              "task": "allow",
              "external_directory": "allow",
              "todowrite": "allow",
              "question": "deny",
              "webfetch": "allow",
              "websearch": "allow",
              "lsp": "allow",
              "doom_loop": "allow",
              "skill": "allow"
            }
          }
          EOF
      # action 固定到 v1.18.33 的 commit，避免可变 @latest 标签带来的供应链风险
      - name: Run opencode
        uses: anomalyco/opencode/github@51ef4be1d3c122f18fefb510dca8d778571f4f18 # v1.18.33
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/mimo-v2.6-flash
          # 跳过 OIDC App token 交换，改用上面导出的只读 GITHUB_TOKEN
          use_github_token: "true"
