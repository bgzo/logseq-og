name: PR Labeler
on:
  pull_request_target:
    types: [opened]

# Adding labels to a PR requires pull-requests: write; creating missing
# labels requires issues: write.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: TimonVS/pr-labeler-action@v3.1.0
        with:
          # optional, .github/pr-labeler.yml is the default value
          configuration-path: .github/pr-labeler.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
